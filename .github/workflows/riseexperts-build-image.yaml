name: RISE Experts image

# Builds our patched Twenty into a container image and pushes it to GHCR, so
# production never builds on the box it serves from. twenty-front's build
# needs more memory than the CRM host has spare.
on:
  push:
    branches:
      - riseexperts/**
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to publish alongside the commit SHA
        required: false
        default: latest

concurrency:
  group: riseexperts-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rise-experts/twenty

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          # The CRM host is x86_64. Building arm64 as well would roughly
          # double the build for an image nothing runs.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ inputs.tag || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to crm.riseexperts.de
        if: github.ref == 'refs/heads/riseexperts/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # deploy-image.sh lives in the private twenty-apps repo, already
          # cloned on the host, so the rollback logic is version controlled in
          # one place rather than duplicated in this workflow.
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /root/twenty-apps && git pull --quiet && bash deploy/deploy-image.sh ${{ env.IMAGE }}:${{ github.sha }}"

      - name: Summarise
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "TAG=${{ github.sha }} docker compose up -d" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
